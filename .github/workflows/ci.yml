name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck + emit)
        run: npm run build

      - name: Unit / contract / integration tests
        run: npm test

      - name: Emacs org validity check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq emacs-nox
          npm run test:emacs
